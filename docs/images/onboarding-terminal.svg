<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MCPSentinel terminal onboarding</title>
  <desc id="desc">Terminal output from the MCPSentinel 0.8.3 onboarding command.</desc>
  <rect width="1440" height="900" fill="#0d1117"/>
  <rect x="40" y="36" width="1360" height="828" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M58 106h1324" stroke="#30363d" stroke-width="2"/>
  <circle cx="82" cy="71" r="10" fill="#ff5f57"/><circle cx="114" cy="71" r="10" fill="#febc2e"/><circle cx="146" cy="71" r="10" fill="#28c840"/>
  <text x="720" y="78" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" text-anchor="middle">MCPSentinel — first-run onboarding</text>
  <g font-family="Menlo,Monaco,Consolas,monospace" font-size="22" xml:space="preserve">
    <text x="88" y="154" fill="#7ee787">$</text><text x="114" y="154" fill="#e6edf3"> mcpsentinel</text>
    <text x="88" y="207" fill="#79c0ff">+----------------------------------------------------------------+</text>
    <text x="88" y="235" fill="#79c0ff">|                          MCPSENTINEL                           |</text>
    <text x="88" y="263" fill="#79c0ff">|       Security review for Model Context Protocol servers        |</text>
    <text x="88" y="291" fill="#79c0ff">|                     Read-only by default                       |</text>
    <text x="88" y="319" fill="#79c0ff">+----------------------------------------------------------------+</text>
    <text x="88" y="374" fill="#e6edf3">Welcome to </text><text x="246" y="374" fill="#7ee787">MCPSentinel 0.8.3</text>
    <text x="88" y="428" fill="#c9d1d9">MCPSentinel discovers MCP metadata, applies static security rules, and then</text>
    <text x="88" y="456" fill="#c9d1d9">triages candidate findings. A normal scan is read-only: it does not invoke</text>
    <text x="88" y="484" fill="#c9d1d9">server tools. Dynamic tool validation is a separate explicit opt-in.</text>
    <text x="88" y="548" fill="#e6edf3">1. Run your first offline scan:</text>
    <text x="112" y="580" fill="#79c0ff">mcpsentinel scan http://localhost:8000/mcp</text>
    <text x="88" y="644" fill="#e6edf3">2. Save CI-friendly output and fail on high-severity findings:</text>
    <text x="112" y="676" fill="#79c0ff">mcpsentinel scan http://localhost:8000/mcp --format sarif --output results.sarif --fail-on high</text>
    <text x="88" y="748" fill="#8b949e">No API key is needed for the default offline heuristic judge.</text>
    <text x="88" y="808" fill="#7ee787">✓ </text><text x="114" y="808" fill="#e6edf3">Ready to review MCP metadata safely.</text>
  </g>
</svg>
