name: MCPSentinel
description: Scan an MCP server in CI and write a SARIF report.
branding:
  icon: shield
  color: purple
inputs:
  target:
    description: Absolute Streamable HTTP MCP URL, or a trusted quoted stdio command when explicitly enabled.
    required: true
  transport:
    description: "Target transport: auto, http, or stdio."
    required: false
    default: auto
  allow-stdio-execution:
    description: >-
      Set true only in a trusted workflow to start a stdio MCP process on the runner.
      Never enable for untrusted pull requests or forks.
    required: false
    default: "false"
  fail-on:
    description: "Fail the action at this severity: none, low, medium, high, or critical."
    required: false
    default: high
  report-path:
    description: SARIF output path.
    required: false
    default: mcpsentinel.sarif
  baseline-dir:
    description: Approved baseline and judge-cache directory, normally persisted by the workflow cache.
    required: false
    default: .mcpsentinel
  approve-baseline:
    description: "Set true only in a reviewed, trusted workflow to replace the approved baseline."
    required: false
    default: "false"
  rules:
    description: Optional additive JSON rule file path.
    required: false
    default: ""
  policy:
    description: Optional JSON policy file path.
    required: false
    default: ""
  judge:
    description: "Semantic judge: heuristic, openai, or auto."
    required: false
    default: heuristic
outputs:
  sarif:
    description: Path to the generated SARIF report.
    value: ${{ inputs.report-path }}
runs:
  using: composite
  steps:
    - name: Restore MCPSentinel baseline cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.baseline-dir }}
        key: mcpsentinel-${{ runner.os }}-${{ github.repository }}-${{ github.ref_name }}
        restore-keys: |
          mcpsentinel-${{ runner.os }}-${{ github.repository }}-
    - shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_TRANSPORT: ${{ inputs.transport }}
        INPUT_ALLOW_STDIO_EXECUTION: ${{ inputs.allow-stdio-execution }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_BASELINE_DIR: ${{ inputs.baseline-dir }}
        INPUT_APPROVE_BASELINE: ${{ inputs.approve-baseline }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_JUDGE: ${{ inputs.judge }}
      run: |
        effective_transport="$INPUT_TRANSPORT"
        if [[ "$effective_transport" == "auto" ]]; then
          case "$INPUT_TARGET" in
            http://*|https://*) effective_transport="http" ;;
            *) effective_transport="stdio" ;;
          esac
        fi
        if [[ "$effective_transport" == "stdio" && "$INPUT_ALLOW_STDIO_EXECUTION" != "true" ]]; then
          echo "::error::Stdio scanning starts the target process on the GitHub Actions runner. Set allow-stdio-execution: \"true\" only for trusted code."
          exit 2
        fi
        python -m pip install --require-hashes -r "$GITHUB_ACTION_PATH/requirements.lock"
        python -m pip install --no-deps --no-build-isolation "$GITHUB_ACTION_PATH"
        python -m pip check
        command=(scan "$INPUT_TARGET" --transport "$INPUT_TRANSPORT" --format sarif --output "$INPUT_REPORT_PATH" --baseline-dir "$INPUT_BASELINE_DIR" --judge "$INPUT_JUDGE" --fail-on "$INPUT_FAIL_ON")
        if [[ "$INPUT_APPROVE_BASELINE" == "true" ]]; then command+=(--approve-baseline); fi
        if [[ -n "$INPUT_RULES" ]]; then command+=(--rules "$INPUT_RULES"); fi
        if [[ -n "$INPUT_POLICY" ]]; then command+=(--policy "$INPUT_POLICY"); fi
        mcpsentinel "${command[@]}"
