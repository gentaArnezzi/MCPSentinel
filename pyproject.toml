[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-guardian-scan"
version = "0.8.4"
description = "Precision-first security scanner for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Genta" }]
keywords = ["mcp", "security", "scanner", "llm-security", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "httpcore2>=2.10,<3",
  "httpx2>=2.10,<3",
  "jinja2>=3.1.5,<4",
  "mcp>=2.0,<3",
  "openai>=2.11.0,<4",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
]

[project.urls]
Homepage = "https://github.com/gentaArnezzi/MCPSentinel"
Repository = "https://github.com/gentaArnezzi/MCPSentinel"
Issues = "https://github.com/gentaArnezzi/MCPSentinel/issues"

[project.optional-dependencies]
build = ["hatchling==1.32.0"]
dev = [
  "build>=1.2",
  "pip-audit>=2.9",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "twine>=6.1",
]

[project.scripts]
mcpsentinel = "mcpsentinel.cli:main"
mcpsentinel-mcp = "mcpsentinel.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsentinel"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/datasets", "/examples", "/registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
