[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcpsentinel"
version = "0.1.0"
description = "Precision-first security scanner for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Genta" }]
keywords = ["mcp", "security", "scanner", "llm-security", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "jinja2>=3.1.5,<4",
  "mcp>=2.0,<3",
  "openai>=2.11.0,<4",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
mcpsentinel = "mcpsentinel.cli:main"
mcpsentinel-mcp = "mcpsentinel.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
