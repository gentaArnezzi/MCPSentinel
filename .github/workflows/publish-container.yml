name: Publish container image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'name=ghcr.io/%s\nversion=%s\n' "$repository" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish versioned image
        shell: bash
        run: |
          docker build --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" .
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
      - name: Publish latest image tag
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"
