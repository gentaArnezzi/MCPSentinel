name: Publish container image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'name=ghcr.io/%s\nversion=%s\n' "$repository" "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and validate versioned image
        shell: bash
        run: |
          docker build --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" .
          runtime_version="$(docker run --rm --read-only --user 10001:10001 "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" --version | awk '{print $2}')"
          test "$runtime_version" = "${{ steps.image.outputs.version }}"
      - name: Publish versioned image
        shell: bash
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}"
      - name: Publish latest image tag
        if: ${{ !github.event.release.prerelease }}
        shell: bash
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"
