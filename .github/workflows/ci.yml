name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run pip check
      - run: uv run pip-audit --requirement requirements.lock --strict --disable-pip
      - run: uv build
      - run: uv run twine check dist/*

  docker-sandbox-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --all-extras
      - run: MCPSENTINEL_RUN_DOCKER_TESTS=1 uv run pytest -q tests/test_dynamic_docker_e2e.py

  container-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag mcpsentinel:ci .
      - run: docker run --rm --read-only --user 10001:10001 mcpsentinel:ci --version

  action-smoke-test:
    needs: [test, docker-sandbox-test, container-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./
        id: denied-stdio
        continue-on-error: true
        with:
          target: python tests/fixture_stdio_server.py
          transport: stdio
          fail-on: none
      - if: steps.denied-stdio.outcome != 'failure'
        run: exit 1
      - uses: ./
        id: scan
        with:
          target: python tests/fixture_stdio_server.py
          transport: stdio
          allow-stdio-execution: "true"
          fail-on: none
          report-path: mcpsentinel.sarif
      - run: test -s '${{ steps.scan.outputs.sarif }}'
