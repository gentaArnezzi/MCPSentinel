name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run pip check
      - run: uv run pip-audit --requirement requirements.lock --strict --disable-pip
      - run: uv build
      - run: uv run twine check dist/*

  docker-sandbox-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked --all-extras
      - run: MCPSENTINEL_RUN_DOCKER_TESTS=1 uv run pytest -q tests/test_dynamic_docker_e2e.py

  action-smoke-test:
    needs: [test, docker-sandbox-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: ./
        id: scan
        with:
          target: python tests/fixture_stdio_server.py
          transport: stdio
          fail-on: none
          report-path: mcpsentinel.sarif
      - run: test -s '${{ steps.scan.outputs.sarif }}'
