name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir dist

  action-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./
        id: scan
        with:
          target: python tests/fixture_stdio_server.py
          transport: stdio
          fail-on: none
          report-path: mcpsentinel.sarif
      - run: test -s '${{ steps.scan.outputs.sarif }}'
